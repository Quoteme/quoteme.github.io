<!--
Google Analytics, gated by Quarto's cookie-consent banner (see _quarto.yml).
Quarto's built-in `google-analytics` option loads gtag.js unconditionally
(only the config call is gated), which already sends the visitor's IP to
Google before consent. Here the loader itself runs only after opt-in.
-->
<script type="text/plain" cookie-consent="tracking">
(function () {
  var s = document.createElement("script");
  s.async = true;
  s.src = "https://www.googletagmanager.com/gtag/js?id=G-TS8KXZ05HZ";
  document.head.appendChild(s);
})();
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', 'G-TS8KXZ05HZ');
</script>
<script>
// The stock banner text mentions personalised ads; we only use analytics.
document.addEventListener("DOMContentLoaded", function () {
  setTimeout(function () {
    var de = document.documentElement.lang === "de";
    var text = document.querySelector(".cc-nb-text");
    if (text) text.textContent = de
      ? "Mit Ihrer Zustimmung nutzen wir Google Analytics, um auszuwerten, wie diese Website genutzt wird. Dabei werden Cookies gesetzt und Daten an Google (ggf. in die USA) übermittelt. Ohne Zustimmung werden keine Analyse-Cookies gesetzt. Sie können Ihre Auswahl jederzeit über „Cookie-Einstellungen“ im Fußbereich ändern."
      : "With your consent we use Google Analytics to measure how this website is used. This sets cookies and transfers data to Google (possibly to the USA). Without consent no analytics cookies are set. You can change your choice at any time via “Cookie Preferences” in the footer.";
    var prefs = document.getElementById("open_preferences_center");
    if (prefs && de) prefs.textContent = "Cookie-Einstellungen";
  }, 0);
});
</script>
