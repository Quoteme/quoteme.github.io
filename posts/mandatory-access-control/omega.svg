<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" font-family="sans-serif" font-size="14">
  <defs>
    <marker id="om-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f7fd1"/>
    </marker>
  </defs>
  <g fill="none" stroke="#4f7fd1" stroke-width="1.6" marker-end="url(#om-arr)">
    <!-- loops on ⊤ -->
    <path d="M 186,102 C 150,20 70,40 172,110"/>
    <path d="M 172,130 C 70,200 150,220 186,138"/>
    <!-- ⊤ -> ⊥ and ⊥ -> ⊤ -->
    <path d="M 220,108 Q 300,60 382,108"/>
    <path d="M 382,132 Q 300,180 220,132"/>
    <!-- loop on ⊥ -->
    <path d="M 422,108 C 530,50 530,190 422,132"/>
  </g>
  <g fill="#4f7fd1" stroke="none">
    <circle cx="200" cy="120" r="18" fill-opacity="0.15" stroke="#4f7fd1"/>
    <circle cx="400" cy="120" r="18" fill-opacity="0.15" stroke="#4f7fd1"/>
    <text x="200" y="126" text-anchor="middle" font-size="18">⊤</text>
    <text x="400" y="126" text-anchor="middle" font-size="18">⊥</text>
    <text x="100" y="40" text-anchor="middle">all</text>
    <text x="100" y="212" text-anchor="middle">ends</text>
    <text x="300" y="72" text-anchor="middle">src</text>
    <text x="300" y="180" text-anchor="middle">tgt</text>
    <text x="528" y="125" text-anchor="middle">none</text>
  </g>
</svg>
