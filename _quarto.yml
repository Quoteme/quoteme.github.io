project:
  type: website
  post-render:
    # GDPR: YouTube embeds only load after a click (see the script).
    - youtube-consent.py
    # SEO/GEO: canonicals, descriptions, BlogPosting schema, noindex drafts.
    - seo-postrender.py
  resources:
    - robots.txt
    - llms.txt
    - assets/leaflet/*
    - assets/fonts/*
    - assets/avatar.jpg

website:
  site-url: "https://happel.ai/"
  title: "happel.ai"
  favicon: "favicon.png"
  description: "Luca Happel builds, audits and hacks high-security systems for regulated industries: security audits, penetration testing, reverse engineering, AI and app development."
  open-graph:
    site-name: "happel.ai"
    image: https://happel.ai/assets/avatar.jpg
    description: "Luca Happel builds, audits and hacks high-security systems for regulated industries: security audits, penetration testing, reverse engineering, AI and app development."
  twitter-card:
    card-style: summary
    image: https://happel.ai/assets/avatar.jpg
    description: "Luca Happel builds, audits and hacks high-security systems for regulated industries: security audits, penetration testing, reverse engineering, AI and app development."
  # GDPR/TDDDG: Google Analytics (ga-consent.html) is only loaded after
  # explicit opt-in via this banner. Do not use Quarto's `google-analytics`
  # option: it loads gtag.js before consent.
  cookie-consent:
    type: express
    style: simple
    palette: light
    policy-url: /datenschutz.html

  draft-mode: unlinked
  navbar:
    title: false
    logo:
      light:
        path: assets/happel-ai-logo.svg
        alt: "happel.ai"
      dark:
        path: assets/happel-ai-logo-dark.svg
        alt: "happel.ai"
    logo-href: /index.qmd
    collapse-below: md
    left:
      - text: Shop
        icon: shop
        href: /shop/index.qmd#services
      - text: Locations
        icon: geo-alt
        href: locations/index.qmd
      - text: Blog
        icon: journal-text
        href: blog.qmd
    tools:
      - icon: github
        aria-label: GitHub
        href: https://github.com/Quoteme/
      - icon: linkedin
        aria-label: Linkedin
        href: https://www.linkedin.com/in/lucahappel/
      - icon: instagram
        aria-label: Instagram
        href: https://www.instagram.com/lucaleonhappel/
      - icon: reddit
        aria-label: Reddit
        href: https://www.reddit.com/user/lalelul
  page-footer:
    center:
      - text: "Impressum"
        href: "impressum.qmd"
      - text: "Datenschutz"
        href: "datenschutz.qmd"
format:
  html:
    include-in-header:
      - file: "macros.html"
      - file: "ga-consent.html"
    css: styles.css
    theme:
      light: [cosmo, theme-fonts.scss]
      dark: [cosmo, theme-fonts.scss, theme-dark.scss]
    respect-user-color-scheme: true
    filters:
      - callouty-theorem
